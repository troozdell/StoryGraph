name: Update StoryGraph stats

on:
  schedule:
    # Runs every 6 hours. Adjust as you like — StoryGraph stats don't
    # change fast enough to need anything more frequent.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape StoryGraph
        # Replace YOUR_STORYGRAPH_USERNAME with hers.
        run: python3 scrape_storygraph.py YOUR_STORYGRAPH_USERNAME stats.json

      - name: Commit updated stats.json
        run: |
          git config user.name "storygraph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Update StoryGraph stats"
          git push
