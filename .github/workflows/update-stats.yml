name: Update StoryGraph stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Scrape StoryGraph
        run: python3 scrape_storygraph.py hopebales stats.json

      - name: Commit updated stats.json
        run: |
          git config user.name "storygraph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Update StoryGraph stats"
          git push
